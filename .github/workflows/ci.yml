name: PlatformIO Build

on:
  workflow_dispatch:      # Запуск вручную кнопкой Run workflow
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    # Запускаем компиляцию проекта под ESP32-S3
    - name: Run PlatformIO Build
      run: |
        pio run

    # Собираем абсолютно все полученные раздельные .bin файлы
    - name: Collect Binaries
      run: |
        mkdir -p build_out
        find .pio/ -name "*.bin" -exec cp {} build_out/ \; 2>/dev/null || true
        echo "=== Сгенерированные файлы прошивки ==="
        ls -la build_out

    # Упаковываем файлы в архив для скачивания
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: platformio-binaries
        path: build_out/*
