name: ESP-IDF Build

on:
  workflow_dispatch:      # Позволяет запускать сборку вручную кнопкой Run workflow
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive' # Автоматически скачиваем все встроенные библиотеки

    # Устанавливаем официальный компилятор ESP-IDF версии 5.1
    - name: Install ESP-IDF
      uses: espressif/install-esp-idf-action@v1
      with:
        version: 'v5.1.2'

    # Компиляция проекта под чип ESP32-S3 (используем встроенную команду $IDF_PATH)
    - name: Build Firmware for ESP32-S3
      run: |
        . $IDF_PATH/export.sh
        idf.py set-target esp32s3
        idf.py build

    # Собираем все полученные раздельные .bin файлы
    - name: Collect Binaries
      run: |
        mkdir -p build_out
        cp build/bootloader/bootloader.bin build_out/ 2>/dev/null || true
        cp build/partition_table/partition-table.bin build_out/ 2>/dev/null || true
        cp build/retro-go.bin build_out/ 2>/dev/null || true
        cp build/launcher.bin build_out/ 2>/dev/null || true
        echo "=== Сгенерированные файлы прошивки под ESP32-S3 ==="
        ls -la build_out

    # Упаковываем файлы в архив для скачивания
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: esp32s3-binaries
        path: build_out/*
