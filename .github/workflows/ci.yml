name: ESP-IDF Docker Build

on:
  workflow_dispatch:      # Позволяет запускать сборку вручную кнопкой Run workflow
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive' # Скачиваем все встроенные библиотеки ядра

    # Запускаем официальный контейнер ESP-IDF и принудительно заходим в папку launcher
    - name: Build with ESP-IDF Docker
      run: |
        docker run --rm -v ${{ github.workspace }}:/project -w /project/launcher espressif/idf:release-v5.1 sh -c "
          idf.py set-target esp32s3
          idf.py build
        "

    # Собираем все полученные бинарники из папки launcher/build
    - name: Collect Binaries
      run: |
        mkdir -p build_out
        cp launcher/build/bootloader/bootloader.bin build_out/ 2>/dev/null || true
        cp launcher/build/partition_table/partition-table.bin build_out/ 2>/dev/null || true
        cp launcher/build/launcher.bin build_out/ 2>/dev/null || true
        echo "=== Сгенерированные файлы прошивки под ESP32-S3 ==="
        ls -la build_out

    # Упаковываем файлы в архив для скачивания
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: esp32s3-binaries
        path: build_out/*
