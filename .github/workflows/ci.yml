name: ESP-IDF Docker Build

on:
  workflow_dispatch:      # Позволяет запускать сборку вручную кнопкой Run workflow
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive' # Скачиваем встроенные библиотеки ядра эмулятора

    # ХАК: Переносим все файлы в папку БЕЗ дефисов, чтобы CMake не генерировал кривые макросы
    - name: Rename workspace folder to remove dashes
      run: |
        cd ..
        mv retro-go retrogo
        ln -s retrogo retro-go # Создаем символическую ссылку для совместимости с путями GitHub

    # Запускаем контейнер из папки без дефисов
    - name: Build with ESP-IDF Docker
      run: |
        docker run --rm -v /home/runner/work/retro-go/retrogo:/project -w /project/launcher espressif/idf:release-v5.1 sh -c "
          idf.py fullclean
          idf.py set-target esp32s3
          idf.py build
        "

    # Собираем все полученные раздельные .bin файлы
    - name: Collect Binaries
      run: |
        mkdir -p build_out
        cp /home/runner/work/retro-go/retrogo/launcher/build/bootloader/bootloader.bin build_out/ 2>/dev/null || true
        cp /home/runner/work/retro-go/retrogo/launcher/build/partition_table/partition-table.bin build_out/ 2>/dev/null || true
        cp /home/runner/work/retro-go/retrogo/launcher/build/launcher.bin build_out/ 2>/dev/null || true
        echo "=== Сгенерированные файлы прошивки под ESP32-S3 ==="
        ls -la build_out

    # Упаковываем файлы в архив для скачивания
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: esp32s3-binaries
        path: build_out/*
